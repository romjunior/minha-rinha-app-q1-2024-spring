worker_processes 1;
worker_rlimit_nofile 65536;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    log_format upstream_failure '$remote_addr "$request" status=$status request_time=$request_time '
                                'upstream_addr=$upstream_addr upstream_status=$upstream_status '
                                'upstream_connect_time=$upstream_connect_time '
                                'upstream_header_time=$upstream_header_time '
                                'upstream_response_time=$upstream_response_time';
    map $status $log_upstream_failure {
        default 0;
        ~^[45] 1;
    }
    access_log /dev/stdout upstream_failure if=$log_upstream_failure;
    sendfile   on;

    upstream api {
        # A mesma URI de transação sempre chega à mesma API. A API serializa por cliente.
        hash $uri consistent;
        server api01:8080 max_fails=0;
        server api02:8080 max_fails=0;
        keepalive 24;
    }

    server {
        listen 9999; # Lembra da porta 9999 obrigatória?

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # The application deliberately queues requests while its JDBC pool is busy.
            proxy_connect_timeout 45s;
            proxy_send_timeout 45s;
            proxy_read_timeout 45s;
        }
    }
}
