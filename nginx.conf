worker_processes 1;
worker_rlimit_nofile 65536;

events {
    worker_connections 32768;
    multi_accept on;
}

http {
    access_log off;
    sendfile   on;

    # A mesma conta deve chegar sempre à mesma API. Isso permite que a fila de
    # micro-lotes seja local, sem abrir mão do lock de segurança no PostgreSQL.
    map $uri $cliente_routing_key {
        ~^/clientes/(?<cliente_id>[0-9]+)/(transacoes|extrato)$ $cliente_id;
        default $uri;
    }

    upstream api {
        hash $cliente_routing_key consistent;
        # Não retire todas as APIs do balanceamento durante um pico transitório de fila.
        server api01:8080 max_fails=0;
        server api02:8080 max_fails=0;
        keepalive 64;
    }

    server {
        listen 9999; # Lembra da porta 9999 obrigatória?

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # The application deliberately queues requests while its JDBC pool is busy.
            proxy_connect_timeout 45s;
            proxy_send_timeout 45s;
            proxy_read_timeout 45s;
        }
    }
}
